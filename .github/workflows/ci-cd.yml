# ============================================================
# SolarMitra — CI/CD Pipeline
# ============================================================
#
# Triggers:
#   • Every pull request targeting main  → CI (test + typecheck + build)
#   • Every push to main                 → CI + Docker build & push to GHCR
#
# Required GitHub Secrets (Settings → Secrets → Actions):
#   JWT_SECRET              Random hex string (openssl rand -hex 32)
#   ADMIN_EMAIL             Optional: override seeded admin email
#   ADMIN_PASSWORD          Optional: override seeded admin password
#
# Optional secrets for MongoDB (when DEMO_MODE=false):
#   MONGO_URI               MongoDB Atlas connection string
#
# Registry: ghcr.io (GitHub Container Registry — free, no external account needed)
# Deployment: AWS (manual or separate pipeline — image pulled from GHCR)
# ============================================================

name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/solarmitra
  NODE_VERSION: "22"

permissions:
  contents: read
  packages: write          # push to GHCR

jobs:
  # ============================================================
  # Job 1 — Test + Typecheck + Build
  # ============================================================
  ci:
    name: Test · Typecheck · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      # Install all dependencies (root postinstall installs server + client)
      - name: Install dependencies
        run: npm ci

      # TypeScript strict check for both packages
      - name: Typecheck (server + client)
        run: npm run typecheck

      # Server tests (vitest + supertest, 160+ tests)
      - name: Run server tests
        run: npm --prefix server test
        env:
          NODE_ENV: test
          DEMO_MODE: "true"
          JWT_SECRET: "ci_only_secret_not_for_production"

      # Client unit tests (vitest)
      - name: Run client tests
        run: npm --prefix client test
        env:
          NODE_ENV: test

      # Production build (client Vite + server tsc)
      - name: Build (client + server)
        run: npm run build
        env:
          VITE_API_URL: /api
          VITE_DEMO_MODE: "true"

  # ============================================================
  # Job 2 — Build & push Docker image (main branch only)
  # ============================================================
  docker:
    name: Docker Build & Push
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer cache: re-uses layers from the last push for fast rebuilds
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_API_URL=/api
            VITE_DEMO_MODE=true

