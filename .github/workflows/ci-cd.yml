# ============================================================
# SolarMitra — CI/CD Pipeline
# ============================================================
#
# Triggers:
#   • Every pull request targeting main  → CI (test + typecheck + build)
#   • Every push to main                 → CI + Docker build & push to GHCR
#
# Required GitHub Secrets (Settings → Secrets → Actions):
#   JWT_SECRET              Random hex string (openssl rand -hex 32)
#   ADMIN_EMAIL             Optional: override seeded admin email
#   ADMIN_PASSWORD          Optional: override seeded admin password
#
# Optional secrets for MongoDB (when DEMO_MODE=false):
#   MONGO_URI               MongoDB Atlas connection string
#
# Registry: ghcr.io (GitHub Container Registry — free, no external account needed)
# Deployment: AWS (manual or separate pipeline — image pulled from GHCR)
# ============================================================

name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/solarmitra
  NODE_VERSION: "22"
  # Live production deployment (CloudFront in front of the AWS-hosted app)
  PROD_URL: "https://dk57cxucy0xlq.cloudfront.net"

permissions:
  contents: read
  packages: write          # push to GHCR
  deployments: write       # record the "production" deployment (Job 3)

jobs:
  # ============================================================
  # Job 1 — Test + Typecheck + Build
  # ============================================================
  ci:
    name: Test · Typecheck · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      # Install all dependencies (root postinstall installs server + client)
      - name: Install dependencies
        run: npm ci

      # TypeScript strict check for both packages
      - name: Typecheck (server + client)
        run: npm run typecheck

      # Server tests (vitest + supertest, 160+ tests)
      - name: Run server tests
        run: npm --prefix server test
        env:
          NODE_ENV: test
          DEMO_MODE: "true"
          JWT_SECRET: "ci_only_secret_not_for_production"

      # Client unit tests (vitest)
      - name: Run client tests
        run: npm --prefix client test
        env:
          NODE_ENV: test

      # Production build (client Vite + server tsc)
      - name: Build (client + server)
        run: npm run build
        env:
          VITE_API_URL: /api
          VITE_DEMO_MODE: "true"

  # ============================================================
  # Job 2 — Build & push Docker image (main branch only)
  # ============================================================
  docker:
    name: Docker Build & Push
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer cache: re-uses layers from the last push for fast rebuilds
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_API_URL=/api
            VITE_DEMO_MODE=true

  # ============================================================
  # Job 3 — Post-deploy smoke test (main branch only)
  # ------------------------------------------------------------
  # The `environment` block registers a GitHub Deployment, so the live URL
  # appears under the repo's "Environments / Deployments". The steps then
  # curl the deployed website and its API health endpoint (with retries)
  # and fail the pipeline if production is not healthy.
  # ============================================================
  deploy-check:
    name: Deployment Health Check
    needs: docker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: ${{ env.PROD_URL }}

    steps:
      - name: Check website is reachable (/)
        id: site
        shell: bash
        run: |
          # SPA shell must answer HTTP 200 and contain the React mount point.
          check_url() {
            local url="$1" marker="$2" out code total attempt
            for attempt in 1 2 3 4 5; do
              out=$(curl -sS -L -o /tmp/body -w '%{http_code} %{time_total}' --max-time 20 "$url" 2>/dev/null) || out='000 0'
              code="${out%% *}"; total="${out##* }"
              if [ "$code" = "200" ] && grep -q "$marker" /tmp/body 2>/dev/null; then
                echo "code=$code" >> "$GITHUB_OUTPUT"
                echo "time=$total" >> "$GITHUB_OUTPUT"
                echo "OK  $url → HTTP $code in ${total}s (attempt $attempt)"
                return 0
              fi
              echo "…  $url attempt $attempt → HTTP $code"
              [ "$attempt" = "5" ] || sleep 10
            done
            echo "FAILED $url after 5 attempts"
            return 1
          }
          check_url "${PROD_URL}/" 'id="root"'

      - name: Check API health (/api/health)
        id: api
        shell: bash
        run: |
          # Backend must answer HTTP 200 with {"status":"ok", ...}
          check_url() {
            local url="$1" marker="$2" out code total attempt
            for attempt in 1 2 3 4 5; do
              out=$(curl -sS -L -o /tmp/body -w '%{http_code} %{time_total}' --max-time 20 "$url" 2>/dev/null) || out='000 0'
              code="${out%% *}"; total="${out##* }"
              if [ "$code" = "200" ] && grep -q "$marker" /tmp/body 2>/dev/null; then
                echo "code=$code" >> "$GITHUB_OUTPUT"
                echo "time=$total" >> "$GITHUB_OUTPUT"
                echo "body=$(cat /tmp/body)" >> "$GITHUB_OUTPUT"
                echo "OK  $url → HTTP $code in ${total}s (attempt $attempt)"
                cat /tmp/body
                return 0
              fi
              echo "…  $url attempt $attempt → HTTP $code"
              [ "$attempt" = "5" ] || sleep 10
            done
            echo "FAILED $url after 5 attempts"
            return 1
          }
          check_url "${PROD_URL}/api/health" '"status":"ok"'

      - name: Write deployment summary
        if: always()
        shell: bash
        env:
          SITE_CODE: ${{ steps.site.outputs.code || '—' }}
          SITE_TIME: ${{ steps.site.outputs.time || '—' }}
          API_CODE: ${{ steps.api.outputs.code || '—' }}
          API_TIME: ${{ steps.api.outputs.time || '—' }}
          API_BODY: ${{ steps.api.outputs.body || '—' }}
          IMAGE_TAGS: ${{ needs.docker.outputs.image_tags }}
        run: |
          site_icon="❌"; [ "$SITE_CODE" = "200" ] && site_icon="✅"
          api_icon="❌";  [ "$API_CODE" = "200" ]  && api_icon="✅"
          {
            echo "## 🌐 Production deployment"
            echo ""
            echo "| Check | Endpoint | HTTP | Response time |"
            echo "| --- | --- | ---: | ---: |"
            echo "| ${site_icon} Website | ${PROD_URL}/ | ${SITE_CODE} | ${SITE_TIME}s |"
            echo "| ${api_icon} API health | ${PROD_URL}/api/health | ${API_CODE} | ${API_TIME}s |"
            echo ""
            echo "🔗 **Live site:** ${PROD_URL}/"
            echo ""
            echo "🐳 **Images pushed to GHCR:**"
            while IFS= read -r tag; do [ -n "$tag" ] && echo "- \`$tag\`"; done <<< "$IMAGE_TAGS"
            echo ""
            echo "📦 **Commit:** \`${{ github.sha }}\` · 👤 **Actor:** ${{ github.actor }}"
            echo ""
            echo "<details><summary>🩺 Raw /api/health response</summary>"
            echo ""
            echo "\`\`\`json"
            echo "$API_BODY"
            echo "\`\`\`"
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

