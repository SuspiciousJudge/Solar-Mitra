# ============================================================
# SolarMitra — CI/CD Pipeline
# ============================================================
#
# Triggers:
#   • Every pull request targeting main  → CI (test + lint + build + docker build)
#   • Every push to main                 → CI + CD (push image to GHCR + deploy to Cloud Run)
#
# Required GitHub Secrets (Settings → Secrets → Actions):
#   GCP_PROJECT_ID          Google Cloud project ID
#   GCP_SA_KEY              Service account JSON key (base64 or raw JSON)
#   GCP_REGION              Cloud Run region, e.g. asia-south1
#   CLOUD_RUN_SERVICE       Cloud Run service name, e.g. solarmitra
#   JWT_SECRET              Random hex string (openssl rand -hex 32)
#   ADMIN_EMAIL             Optional: override seeded admin email
#   ADMIN_PASSWORD          Optional: override seeded admin password
#
# Optional secrets for MongoDB (when DEMO_MODE=false):
#   MONGO_URI               MongoDB Atlas connection string
#
# Registry: ghcr.io (GitHub Container Registry — free, no external account needed)
# Cloud:    Google Cloud Run (serverless, automatic HTTPS)
# ============================================================

name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/solarmitra
  NODE_VERSION: "22"

permissions:
  contents: read
  packages: write          # push to GHCR

jobs:
  # ============================================================
  # Job 1 — Test + Typecheck + Build
  # ============================================================
  ci:
    name: Test · Typecheck · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      # Install all dependencies (root postinstall installs server + client)
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # TypeScript strict check for both packages
      - name: Typecheck (server + client)
        run: npm run typecheck

      # Server tests (vitest + supertest, 160+ tests)
      - name: Run server tests
        run: npm --prefix server test
        env:
          NODE_ENV: test
          DEMO_MODE: "true"
          JWT_SECRET: "ci_only_secret_not_for_production"

      # Client unit tests (vitest)
      - name: Run client tests
        run: npm --prefix client test
        env:
          NODE_ENV: test

      # Production build (client Vite + server tsc)
      - name: Build (client + server)
        run: npm run build
        env:
          VITE_API_URL: /api
          VITE_DEMO_MODE: "true"

  # ============================================================
  # Job 2 — Build & push Docker image (main branch only)
  # ============================================================
  docker:
    name: Docker Build & Push
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer cache: re-uses layers from the last push for fast rebuilds
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_API_URL=/api
            VITE_DEMO_MODE=true

  # ============================================================
  # Job 3 — Deploy to Google Cloud Run (main branch only)
  # ============================================================
  deploy:
    name: Deploy to Cloud Run
    needs: docker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    # Deployment environment — configure in GitHub repo Settings → Environments
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}

    permissions:
      contents: read
      id-token: write   # required for Workload Identity Federation (recommended)
      packages: read

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          # Alternatively use Workload Identity Federation (more secure; see Cloud docs)

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ secrets.CLOUD_RUN_SERVICE }}
          region: ${{ secrets.GCP_REGION }}
          image: ${{ env.IMAGE_NAME }}@${{ needs.docker.outputs.image_digest }}
          flags: >
            --port=5000
            --allow-unauthenticated
            --min-instances=0
            --max-instances=3
            --memory=512Mi
            --cpu=1
            --timeout=60
          env_vars: |
            NODE_ENV=production
            PORT=5000
            DEMO_MODE=true
          secrets: |
            JWT_SECRET=JWT_SECRET:latest
            MONGO_URI=MONGO_URI:latest

      - name: Show deployment URL
        run: echo "Deployed to ${{ steps.deploy.outputs.url }}"
