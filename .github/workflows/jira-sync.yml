# ============================================================
# SolarMitra — Jira Sync Workflow
# ============================================================
#
# What this does:
#   • Push to any feature branch    → transitions Jira ticket to "In Progress"
#   • PR opened / reopened          → transitions to "In Review" + posts PR link as comment
#   • PR merged into main           → transitions to "Done" + posts merge comment
#   • PR closed without merge       → transitions back to "In Progress"
#   • repository_dispatch (Jira →)  → handles incoming webhook from Jira Automation
#
# Branch naming convention (required to auto-detect the ticket):
#   SCRUM-123                       plain ticket id
#   SCRUM-123-short-description     id + description (recommended)
#   feature/SCRUM-123-description   prefix/id-description
#
# Required GitHub Secrets (Settings → Secrets → Actions):
#   JIRA_BASE_URL     https://shahrahul3785.atlassian.net
#   JIRA_USER_EMAIL   your Atlassian account email
#   JIRA_API_TOKEN    API token from https://id.atlassian.com/manage-profile/security/api-tokens
#
# How to get a Jira API token:
#   1. Go to https://id.atlassian.com/manage-profile/security/api-tokens
#   2. Click "Create API token" → give it a name → copy the value
#   3. Add it as JIRA_API_TOKEN secret in GitHub repo settings
#
# Jira → GitHub (incoming Jira events):
#   To trigger this workflow FROM Jira Automation:
#   1. Open Jira → Project Settings → Automation → Create rule
#   2. Trigger: "Issue transitioned" (or any trigger you want)
#   3. Action: "Send web request"
#      URL:     https://api.github.com/repos/<owner>/Solar-Mitra/dispatches
#      Method:  POST
#      Headers: Authorization: Bearer <your GitHub PAT>
#               Content-Type: application/json
#      Body:    { "event_type": "jira-event",
#                 "client_payload": {
#                   "issue_key":  "{{issue.key}}",
#                   "summary":    "{{issue.summary}}",
#                   "status":     "{{issue.status.name}}",
#                   "assignee":   "{{issue.assignee.displayName}}"
#                 }
#               }
#   The "jira-event" job below receives and logs this payload.
# ============================================================

name: Jira Sync

on:
  push:
    branches-ignore:
      - main          # main pushes are handled by ci-cd.yml

  pull_request:
    types: [opened, reopened, closed]
    branches: [main]

  repository_dispatch:
    types: [jira-event]   # fired by Jira Automation webhook (see instructions above)

jobs:
  # ============================================================
  # Job 1 — On push to a feature branch → In Progress
  # ============================================================
  branch-in-progress:
    name: "Jira: Mark In Progress on branch push"
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Login to Jira
        uses: atlassian/gajira-login@v3
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}

      - name: Find Jira ticket in branch name
        id: find
        uses: atlassian/gajira-find-issue-key@v3
        with:
          # Looks for SCRUM-NNN pattern in the branch name
          from: branch

      - name: Transition ticket → In Progress
        if: steps.find.outputs.issue != ''
        uses: atlassian/gajira-transition@v3
        with:
          issue: ${{ steps.find.outputs.issue }}
          # Must match the transition name in your Jira board exactly.
          # Common names: "In Progress", "Start Progress", "Start"
          transition: "In Progress"

      - name: Log result
        if: steps.find.outputs.issue != ''
        run: echo "Transitioned ${{ steps.find.outputs.issue }} → In Progress (branch ${{ github.ref_name }})"

      - name: No ticket found
        if: steps.find.outputs.issue == ''
        run: echo "No SCRUM-* ticket found in branch name '${{ github.ref_name }}' — skipping."

  # ============================================================
  # Job 2 — PR opened or reopened → In Review + PR comment on Jira
  # ============================================================
  pr-in-review:
    name: "Jira: Mark In Review on PR open"
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'pull_request' &&
      (github.event.action == 'opened' || github.event.action == 'reopened')

    steps:
      - name: Login to Jira
        uses: atlassian/gajira-login@v3
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}

      - name: Find Jira ticket in branch name
        id: find
        uses: atlassian/gajira-find-issue-key@v3
        with:
          from: branch

      - name: Transition ticket → In Review
        if: steps.find.outputs.issue != ''
        uses: atlassian/gajira-transition@v3
        with:
          issue: ${{ steps.find.outputs.issue }}
          # Common names: "In Review", "Code Review", "Review"
          # Adjust to match your Jira board's transition name exactly.
          transition: "In Review"

      - name: Post PR link as Jira comment
        if: steps.find.outputs.issue != ''
        uses: atlassian/gajira-comment@v3
        with:
          issue: ${{ steps.find.outputs.issue }}
          comment: |
            *Pull Request opened for review*

            PR: [${{ github.event.pull_request.title }}|${{ github.event.pull_request.html_url }}]
            Branch: {{monospace}}${{ github.head_ref }}{{monospace}}
            Author: ${{ github.event.pull_request.user.login }}
            Status: Awaiting review

      - name: No ticket found
        if: steps.find.outputs.issue == ''
        run: echo "No SCRUM-* ticket found in branch name — skipping."

  # ============================================================
  # Job 3 — PR merged → Done
  # ============================================================
  pr-merged-done:
    name: "Jira: Mark Done on PR merge"
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true

    steps:
      - name: Login to Jira
        uses: atlassian/gajira-login@v3
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}

      - name: Find Jira ticket in branch name
        id: find
        uses: atlassian/gajira-find-issue-key@v3
        with:
          from: branch

      - name: Transition ticket → Done
        if: steps.find.outputs.issue != ''
        uses: atlassian/gajira-transition@v3
        with:
          issue: ${{ steps.find.outputs.issue }}
          # Common names: "Done", "Close", "Closed", "Resolved"
          transition: "Done"

      - name: Post merge comment on Jira
        if: steps.find.outputs.issue != ''
        uses: atlassian/gajira-comment@v3
        with:
          issue: ${{ steps.find.outputs.issue }}
          comment: |
            *Pull Request merged — issue resolved*

            PR: [${{ github.event.pull_request.title }}|${{ github.event.pull_request.html_url }}]
            Merged by: ${{ github.event.pull_request.merged_by.login }}
            Merge commit: {{monospace}}${{ github.event.pull_request.merge_commit_sha }}{{monospace}}

      - name: No ticket found
        if: steps.find.outputs.issue == ''
        run: echo "No SCRUM-* ticket found in branch name — skipping."

  # ============================================================
  # Job 4 — PR closed WITHOUT merge → back to In Progress
  # ============================================================
  pr-closed-no-merge:
    name: "Jira: Revert to In Progress on PR close (no merge)"
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == false

    steps:
      - name: Login to Jira
        uses: atlassian/gajira-login@v3
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}

      - name: Find Jira ticket in branch name
        id: find
        uses: atlassian/gajira-find-issue-key@v3
        with:
          from: branch

      - name: Transition ticket → In Progress
        if: steps.find.outputs.issue != ''
        uses: atlassian/gajira-transition@v3
        with:
          issue: ${{ steps.find.outputs.issue }}
          transition: "In Progress"

      - name: Post comment on Jira
        if: steps.find.outputs.issue != ''
        uses: atlassian/gajira-comment@v3
        with:
          issue: ${{ steps.find.outputs.issue }}
          comment: |
            *Pull Request closed without merging — moved back to In Progress*

            PR: [${{ github.event.pull_request.title }}|${{ github.event.pull_request.html_url }}]
            Closed by: ${{ github.event.pull_request.user.login }}

      - name: No ticket found
        if: steps.find.outputs.issue == ''
        run: echo "No SCRUM-* ticket found in branch name — skipping."

  # ============================================================
  # Job 5 — Jira ticket created → auto-create GitHub branch
  # ============================================================
  #
  # Triggered by Jira Automation when ANY ticket is created.
  # Automatically creates a branch:
  #   SCRUM-6-fix-login-crash-on-mobile
  #
  # Setup (one-time — see bottom of this file for full instructions):
  #   1. Jira → Project Settings → Automation → Create rule
  #   2. Trigger: "Issue created"
  #   3. Action: "Send web request" → POST to GitHub dispatches API
  #   4. Store a GitHub PAT as GITHUB_PAT secret in this repo
  # ============================================================
  auto-create-branch:
    name: "Jira: Auto-create branch on ticket creation"
    runs-on: ubuntu-latest
    if: github.event_name == 'repository_dispatch' && github.event.action == 'jira-event'

    permissions:
      contents: write   # needed to create branches

    steps:
      - name: Log incoming Jira payload
        run: |
          echo "Issue key  : ${{ github.event.client_payload.issue_key }}"
          echo "Summary    : ${{ github.event.client_payload.summary }}"
          echo "Issue type : ${{ github.event.client_payload.issue_type }}"
          echo "Status     : ${{ github.event.client_payload.status }}"

      - name: Build branch name from ticket key + summary
        id: branch
        run: |
          ISSUE_KEY="${{ github.event.client_payload.issue_key }}"
          SUMMARY="${{ github.event.client_payload.summary }}"

          # Slugify: lowercase, replace non-alphanumeric with hyphen, trim, max 50 chars
          SLUG=$(echo "$SUMMARY" \
            | tr '[:upper:]' '[:lower:]' \
            | sed 's/[^a-z0-9]/-/g' \
            | sed 's/--*/-/g' \
            | sed 's/^-//' \
            | sed 's/-$//' \
            | cut -c1-50)

          BRANCH_NAME="${ISSUE_KEY}-${SLUG}"
          echo "Branch name: $BRANCH_NAME"
          echo "name=$BRANCH_NAME" >> $GITHUB_OUTPUT

      - name: Get SHA of main branch
        id: main_sha
        run: |
          SHA=$(gh api repos/${{ github.repository }}/git/ref/heads/main --jq '.object.sha')
          echo "SHA: $SHA"
          echo "sha=$SHA" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create branch on GitHub
        run: |
          gh api repos/${{ github.repository }}/git/refs \
            -f ref="refs/heads/${{ steps.branch.outputs.name }}" \
            -f sha="${{ steps.main_sha.outputs.sha }}"
          echo "Branch '${{ steps.branch.outputs.name }}' created successfully."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Jira
        uses: atlassian/gajira-login@v3
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}

      - name: Post branch link as comment on Jira ticket
        uses: atlassian/gajira-comment@v3
        with:
          issue: ${{ github.event.client_payload.issue_key }}
          comment: |
            *GitHub branch auto-created*

            Branch: {{monospace}}${{ steps.branch.outputs.name }}{{monospace}}
            Repository: [Solar-Mitra|https://github.com/${{ github.repository }}/tree/${{ steps.branch.outputs.name }}]

            Clone and start working:
            {code}
            git fetch origin
            git checkout ${{ steps.branch.outputs.name }}
            {code}
